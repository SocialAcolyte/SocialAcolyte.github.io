<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>wax-seal</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wax-seal.css">
<style>
  :root{--paper:#f3f0e8;--paper-2:#e9e5da;--ink:#141312;--ink-2:#4a4744;--ink-3:#8a857d;--rule:#cfcac0;--accent:#c96f4a;
    --serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif;--gutter:clamp(16px,3vw,32px)}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:19px;overflow-x:hidden}
  .tag{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
  main{max-width:1180px;margin:0 auto;padding:clamp(56px,10svh,120px) var(--gutter) 120px;
    display:grid;gap:clamp(72px,12svh,140px)}

  /* the deed */
  .deed{position:relative;justify-self:center;width:min(600px,100%);padding:clamp(28px,6vw,56px) clamp(22px,5.5vw,56px) clamp(30px,5vw,48px);
    background:#f8f5ee;border:1px solid #d9d3c6;box-shadow:0 1px 0 #fff inset,0 30px 60px -38px rgba(40,30,20,.35),0 2px 6px -3px rgba(40,30,20,.18)}
  .deed::before{content:"";position:absolute;inset:9px;border:1px solid #e3ddcf;pointer-events:none}
  .deed header{display:flex;justify-content:space-between;align-items:baseline}
  .deed h1{margin:.7em 0 .45em;font-weight:400;font-size:clamp(34px,6.2vw,48px);line-height:1;letter-spacing:-.005em}
  .deed p{margin:0 0 .8em;color:var(--ink-2);line-height:1.42;font-size:clamp(19.5px,2.2vw,21px);text-wrap:pretty}
  .deed .sign{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:28px 24px;margin-top:2.1em}
  .deed .line{flex:1 1 180px;min-width:160px;border-bottom:1px solid var(--ink-3);padding-bottom:6px;min-height:42px;display:flex;align-items:flex-end}
  .deed .line span{font-style:italic;font-size:22px;color:var(--ink);opacity:0;transform:translateY(4px);transition:opacity .8s ease .5s,transform .8s ease .5s}
  .deed.is-signed .line span{opacity:1;transform:none}
  .deed .under{display:flex;justify-content:space-between;margin-top:8px}
  .deed .ws{--ws-m:clamp(60px,6vw,70px);font-size:12.5px}

  /* the letter and the envelope */
  .pair{display:grid;grid-template-columns:1fr;gap:clamp(72px,12svh,120px);align-items:center;justify-items:center}
  @media (min-width:1100px){.pair{grid-template-columns:600px 440px;justify-content:center;gap:clamp(56px,6vw,96px)}}
  .envelope{position:relative;width:min(440px,100%);aspect-ratio:1.5;background:#e7e0d1;
    box-shadow:0 26px 50px -34px rgba(40,30,20,.45),0 1px 3px rgba(40,30,20,.12);transform:rotate(-1.6deg)}
  .envelope svg.flaps{position:absolute;inset:0;width:100%;height:100%}
  .envelope .slot{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%) rotate(1.6deg)}
  .note{max-width:40ch;margin:0 auto;font-size:clamp(24px,3vw,30px);line-height:1.5;color:var(--ink);text-align:center;text-wrap:balance}
  .note .ws{--ws-m:30px;min-height:40px;font-size:10px;padding:4px 1.25em 4px 5px;gap:.7em;transform:translateY(-3px)}
  .foot{justify-self:center}
  @media (prefers-reduced-motion:reduce){.deed .line span{transition:none}}
</style></head><body>
<main>

  <div class="pair">
    <form class="deed" id="deed" autocomplete="off">
      <header><span class="tag">No. 0417</span><span class="tag" id="dated">Dated &mdash;</span></header>
      <h1>Letter of Agreement</h1>
      <p>The undersigned agrees to keep the garden, the library and the small brass key, and to return all three in the condition received.</p>
      <p>Witnessed on paper, in good faith, under seal.</p>
      <div class="sign">
        <div style="flex:1 1 200px">
          <div class="line"><span>L. Aurelia</span></div>
          <div class="under"><span class="tag">Signature</span></div>
        </div>
        <button data-wax-seal data-emblem="assets/herakles-tetradrachm.webp, assets/carnelian-intaglio.webp" data-done="Signed" data-announce="Signed and sealed." name="signed" value="yes">Hold to sign</button>
      </div>
    </form>
    <div class="envelope">
      <svg class="flaps" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 200 L150 104 L300 200" fill="none" stroke="#cfc6b4" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <path d="M0 0 L150 112 L300 0" fill="#ede7da" stroke="#cbc2af" stroke-width="1" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="slot">
        <button type="button" style="--ws-m:clamp(72px,8vw,86px)" data-wax-seal data-layout="medallion" data-done="Sealed" data-wax="#23402c" data-emblem="assets/diocletian-aureus.webp, assets/octavian-aureus.webp">Hold to seal</button>
      </div>
    </div>
  </div>
  <p class="note">I have read the terms and <button type="button" data-wax-seal data-done="Agreed" data-wax="#24211f" data-emblem="assets/perseus-tetradrachm.webp, assets/herakles-tetradrachm.webp" data-reset="6000">Hold to agree</button></p>
  <span class="tag foot">wax-seal</span>
</main>
<script type="module">
  import './wax-seal.js';
  const deed = document.getElementById('deed');
  deed.addEventListener('submit', (e) => e.preventDefault());            // the demo stays on the page
  deed.addEventListener('seal', (e) => {
    deed.classList.add('is-signed');
    const d = new Date(e.detail.at);
    document.getElementById('dated').textContent = 'Dated ' + d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  });
</script>
</body></html>
