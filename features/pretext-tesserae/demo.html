<figure data-pretext-tesserae data-src="assets/neptune.webp" data-src-narrow="assets/neptune-tall.webp" data-colours="2" data-wash="0.92" data-font="'EB Garamond', serif" data-weight="800" data-tracking="-0.01">
  <p class="tes-text">You came in from the street out of the heat and the noise of the port, paid your coin to the doorkeeper, left your clothes with a slave you trusted, and walked out across the sea. It was underfoot the whole time: a white floor as long as a ship, and on it, in black, the god of the sea driving four horses that are horses only as far as the chest, and after that are fish, their tails thrashing and looping into coils. He stands upright with a trident in one hand and the reins loose in the other, and his cloak blows out behind him in a great hoop, as if the wind were coming from the direction he is going. Around him the whole of his household rides along: tritons blowing on shells, sea nymphs lying back on the scaly necks of monsters as if on couches, dolphins, a sea bull, a sea panther, a sea goat with a curled horn, and between them all the little leafy sprays that stand for waves. Nobody had to be told who they were. The town lived by the water. Every sack of grain that fed the city upriver came through this harbour, and the men who carried it, counted it, taxed it and shipped it bathed here after work and walked over this god twice a day. The baths were begun in the reign of Hadrian and finished under his successor, and the floor was laid at the same time, by a workshop that did nothing else, in the way that had become the fashion in this town and nowhere else quite so well: no colour at all, only black stone and white. White limestone for the ground, black for the figures, and the details drawn back into the black with lines of white, so that a muscle, a mane, a fin or the scales of a tail are a few white stones in a row. It is the cheapest way to make a mosaic and the hardest to make a good one, because there is nowhere to hide. Every outline shows. The mosaicists laid the figures first, a row of black stones hugging each edge, then another inside it, and only then filled in the bodies; the white was laid last, in long straight rows across the floor, with the rows near each figure bending a little to follow it, like water moving round a post. Seen from the gallery above, which is where you are meant to see it from, the whole thing reads at once, the god and his horses in the middle and the rabble of the sea around them, like a drawing in ink on a page. Down on the floor, with your feet on it, it is only stones, thousands of them, each a little square of black or white no bigger than a fingernail, set by hand in a bed of mortar one at a time. The water was let out when the town emptied, the roofs fell in, and the river silted up the harbour and moved the coast two miles away. The floor stayed. It is still there, in the open air, and on a hot afternoon the god drives his horses across it toward a sea that is no longer anywhere in sight.</p>
</figure>

<div class="gap"></div>

<figure data-pretext-tesserae data-src="assets/iznik-panel.webp" data-colours="5" data-font="'EB Garamond', serif" data-weight="800" data-tracking="-0.01">
  <p class="tes-text">In the town by the lake the kilns were never cold. The tiles were not clay at all but stone, white quartz from the river crushed to a flour and mixed with ground glass and a little white clay to make it hold, so that when it was fired it rang like a cup and took the colours the way snow takes ink. The designs came from the palace in Istanbul, drawn on paper by the court painters and sent out along the road with the orders: so many tiles for a mosque, so many for a tomb, so many for the walls of a room where the sultan would sit for an hour on a summer evening and never come again. At the workshop they pricked the drawings along every line and laid them on the tiles and pounced charcoal through the holes, so the same tulip could be put down a thousand times and still be drawn by hand. Then the painters went over it. Black for the outlines, with a brush of a few hairs. Cobalt, which was dug in Persia and came along the caravan roads, for the rosettes and the deep blue of the borders. Turquoise and a cool green from copper for the long serrated leaves that bend as if a wind were going through the wall. And last, the red. Nobody else in the world could make it. It was a clay from the mountains in the east, rich in iron, and it had to be laid on so thick that you can feel it standing up under the glaze with your fingertip, like sealing wax, and fired at exactly the heat that would fix it without turning it to brown or leaving it to run. For fifty years they made it perfectly, and then the orders fell away and the masters died and the red went thin and muddy, and it was never made again. A tile panel is put up the way a mosaic is laid: one square at a time, from a plan, into a bed of mortar, each tile carrying a piece of a flower that only exists when all of them are in place. You can still see the joints. The lattice runs across them in red ribbons strung with small white blossoms, and in each opening there is a tulip, or a carnation, or a hyacinth with its head bowed, or a great blue rosette turning like a wheel, and the whole thing repeats upward toward a ceiling it was never hung under. Somebody pried it off a wall, at some point, carefully, and packed it in straw. It hangs now in a museum in Brussels, where the light is grey and the visitors come in wet coats, and every one of them who stops in front of it is standing for a moment in a garden in spring four hundred and fifty years ago, where it is warm and nothing is ever going to die.</p>
</figure>
