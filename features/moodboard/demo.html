<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>moodboard</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="moodboard.css"><style>
  :root{--paper:#f3f0e8;--paper-2:#e9e5da;--ink:#141312;--ink-2:#4a4744;--ink-3:#8a857d;--rule:#cfcac0;--accent:#c96f4a;--sans:Inter,system-ui,sans-serif;--gutter:clamp(10px,2.4vw,32px)}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow-x:hidden}
  .page{padding:0 var(--gutter)}
  .tag{margin:0;padding:clamp(16px,3.4vh,34px) 2px clamp(10px,2vh,18px);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
  .end{height:38svh}
</style></head><body>
<main class="page">
  <p class="tag">Moodboard</p>
  <section data-moodboard data-key="demo" aria-label="Moodboard">
    <ul class="mb-cards">
      <li data-size="0.66" data-label="the gold"><img src="assets/sm/aureus-nero.jpg" width="500" height="506" alt="A gold aureus of Nero"></li>
      <li data-large="assets/lg/decadrachm-syracuse.webp 2000w" data-size="0.74"><img src="assets/sm/decadrachm-syracuse.jpg" width="560" height="560" alt="A silver decadrachm of Syracuse, Arethusa among dolphins"></li>
      <li data-large="assets/lg/denarius-augustus.webp 1920w" data-size="0.62"><img src="assets/sm/denarius-augustus.jpg" width="560" height="549" alt="A silver denarius of Augustus"></li>
      <li data-size="0.56"><img src="assets/sm/solidus-irene.jpg" width="330" height="326" alt="A gold solidus of the Empress Irene"></li>
      <li data-large="assets/lg/moon-engraving.webp 1625w" data-pinned><img src="assets/sm/moon-engraving.jpg" width="455" height="560" alt="An engraving of the moon's surface seen through a telescope"></li>
      <li data-large="assets/lg/dore-wondrous-cold.webp 500w" data-size="0.9"><img src="assets/sm/dore-wondrous-cold.jpg" width="431" height="560" alt="A Doré engraving of a ship among ice"></li>
      <li data-large="assets/lg/mosaic-milreu.webp 2000w" data-size="1.1"><img src="assets/sm/mosaic-milreu.jpg" width="560" height="371" alt="A Roman mosaic of fish and shells from the baths at Milreu"></li>
      <li data-large="assets/lg/mosaic-fish-ducks.webp 1950w" data-size="1.28" data-label="keep"><img src="assets/sm/mosaic-fish-ducks.jpg" width="546" height="560" alt="A Pompeian mosaic of fish and ducks"></li>
      <li data-large="assets/lg/haeckel-actiniae.webp 1425w" data-size="1.08"><img src="assets/sm/haeckel-actiniae.jpg" width="399" height="560" alt="Haeckel's plate of sea anemones"></li>
      <li data-large="assets/lg/haeckel-discomedusae.webp 1394w"><img src="assets/sm/haeckel-discomedusae.jpg" width="390" height="560" alt="Haeckel's plate of jellyfish"></li>
      <li data-large="assets/lg/haeckel-prosobranchia.webp 1426w" data-size="0.96"><img src="assets/sm/haeckel-prosobranchia.jpg" width="399" height="560" alt="Haeckel's plate of sea snails, white on black"></li>
      <li data-large="assets/lg/merian-peppers.webp 1354w" data-size="0.92"><img src="assets/sm/merian-peppers.jpg" width="379" height="560" alt="Maria Sibylla Merian's study of peppers"></li>
      <li data-large="assets/lg/bairei-peony.webp 1378w"><img src="assets/sm/bairei-peony.jpg" width="386" height="560" alt="A Japanese woodblock print of peonies and a crane"></li>
      <li data-large="assets/lg/great-wave.webp 2000w" data-size="1.34" data-label="this blue"><img src="assets/sm/great-wave.jpg" width="560" height="383" alt="Hokusai's Great Wave off Kanagawa"></li>
      <li data-large="assets/lg/zeshin-peony.webp 2000w" data-size="1.04" data-label="softer"><img src="assets/sm/zeshin-peony.jpg" width="560" height="402" alt="Shibata Zeshin's poppies"></li>
      <li data-large="assets/lg/hiroshige-satta.webp 1387w" data-size="0.98"><img src="assets/sm/hiroshige-satta.jpg" width="388" height="560" alt="Hiroshige's wave at Satta beach"></li>
      <li data-large="assets/lg/carnelian-anubis.webp 1920w" data-size="0.7"><img src="assets/sm/carnelian-anubis.jpg" width="560" height="436" alt="A carnelian intaglio of Anubis"></li>
      <li data-large="assets/lg/cone-cedonulli.webp 960w" data-size="0.8"><img src="assets/sm/cone-cedonulli.jpg" width="560" height="448" alt="Two cone shells"></li>
      <li data-large="assets/lg/cowrie-tiger.webp 2000w" data-size="0.86"><img src="assets/sm/cowrie-tiger.jpg" width="560" height="408" alt="Tiger cowrie shells"></li>
      <li data-large="assets/lg/nautilus-weston.webp 1625w" data-size="1.04"><img src="assets/sm/nautilus-weston.jpg" width="455" height="560" alt="Edward Weston's nautilus shell"></li>
      <li data-large="assets/lg/beetle-green.webp 2000w" data-size="0.82"><img src="assets/sm/beetle-green.jpg" width="560" height="252" alt="A green flower beetle"></li>
      <li data-large="assets/lg/stamp-greece.webp 1044w" data-size="0.62"><img src="assets/sm/stamp-greece.jpg" width="436" height="560" alt="A red Greek stamp of 1913"></li>
      <li data-large="assets/lg/stamp-iceland.webp 500w" data-size="0.64" data-pinned><img src="assets/sm/stamp-iceland.jpg" width="410" height="560" alt="A violet Icelandic stamp of a geyser"></li>
      <li data-size="0.64"><img src="assets/sm/stamp-monaco.jpg" width="500" height="327" alt="A Monaco airmail stamp"></li>
      <li data-size="0.6"><img src="assets/sm/stamp-egypt.jpg" width="470" height="560" alt="A red Egyptian stamp of the pyramids"></li>
      <li data-large="assets/lg/stamp-levant.webp 500w" data-size="0.6"><img src="assets/sm/stamp-levant.jpg" width="417" height="560" alt="An Austrian Levant stamp, red and gold"></li>
      <li data-large="assets/lg/unicorn-tapestry.webp 2000w" data-size="1.3" data-pinned><img src="assets/sm/unicorn-tapestry.jpg" width="560" height="546" alt="The Unicorn at the Fountain, a tapestry"></li>
      <li data-large="assets/lg/bayeux.webp 2000w" data-size="1.2"><img src="assets/sm/bayeux.jpg" width="560" height="387" alt="A scene from the Bayeux Tapestry"></li>
      <li data-large="assets/lg/iznik-panel.webp 978w" data-label="border?"><img src="assets/sm/iznik-panel.jpg" width="274" height="560" alt="An Iznik tile panel of blue and red flowers"></li>
      <li data-large="assets/lg/ardabil-carpet.webp 1035w" data-size="0.98"><img src="assets/sm/ardabil-carpet.jpg" width="290" height="560" alt="The Ardabil carpet"></li>
      <li data-large="assets/lg/lekythos.webp 1484w" data-size="0.9"><img src="assets/sm/lekythos.jpg" width="415" height="560" alt="A Greek red-figure lekythos"></li>
      <li data-large="assets/lg/panathenaic.webp 1600w" data-size="0.94"><img src="assets/sm/panathenaic.jpg" width="448" height="560" alt="A Panathenaic prize amphora"></li>
    </ul>
  </section>
  <div class="end"></div>
</main>
<script>{const q=new URLSearchParams(location.search),b=document.querySelector('[data-moodboard]');if(q.has('seed'))b.dataset.seed=q.get('seed');if(q.has('fresh'))try{localStorage.removeItem('moodboard:demo')}catch(e){}}</script>
<script type="module" src="moodboard.js"></script>
</body></html>
