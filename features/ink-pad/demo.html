<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ink-pad</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ink-pad.css">
<style>
  :root{--paper:#f3f0e8;--paper-2:#e9e5da;--ink:#141312;--ink-2:#4a4744;--ink-3:#8a857d;--rule:#cfcac0;--accent:#c96f4a;
    --serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif;--gutter:clamp(16px,3vw,32px)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:19px;overflow-x:hidden}
  .scene{min-height:100svh;display:grid;place-items:center;padding:clamp(28px,7vh,80px) var(--gutter)}
  .card{width:min(100%,760px);
    background:
      repeating-linear-gradient(90deg,transparent 0 86px,rgba(120,100,70,.035) 86px 88px,transparent 88px 92px),
      repeating-linear-gradient(0deg,rgba(120,100,70,.022) 0 1px,transparent 1px 3.5px),
      url(assets/paper-tooth.webp) center/cover,#f8f4ea;background-blend-mode:normal,normal,multiply;padding:clamp(28px,6vw,64px) clamp(22px,6vw,72px) clamp(20px,4vw,40px);
    box-shadow:0 1px 1px rgba(20,19,18,.04),0 6px 14px -6px rgba(20,19,18,.10),0 28px 60px -24px rgba(20,19,18,.16)}
  .no{display:flex;justify-content:space-between;font:500 10.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
  h1{font-weight:400;font-size:clamp(32px,5.2vw,46px);line-height:1.04;margin:clamp(22px,4vw,34px) 0 clamp(18px,3vw,26px);letter-spacing:-.005em}
  .terms{margin:0 0 clamp(18px,4vw,34px);padding:0;list-style:none;font-size:clamp(17px,2vw,19px);line-height:1.5;color:var(--ink-2)}
  .terms li{display:grid;grid-template-columns:2.2em 1fr}
  .terms li+li{margin-top:.5em}
  .terms b{font-weight:400;font-style:italic;color:var(--ink-3)}
  .under{display:flex;justify-content:space-between;margin:10px 0 0;pointer-events:none;font:500 10.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
  .seal{display:flex;justify-content:flex-end;margin-top:clamp(18px,4vw,28px)}
  .seal button{appearance:none;border:0;background:var(--ink);color:var(--paper);font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:16px 22px;border-radius:999px;cursor:pointer}
  .seal button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
  .sig{margin-top:6px;--ip-blotter-image:url(assets/blotter.webp);--ip-blotter-size:330px 385px}
  .ip .under{position:absolute;left:7%;right:6%;top:var(--ip-line-y);margin-top:12px}
  .card{position:relative}
  .stamp{position:absolute;right:calc(clamp(22px,6vw,72px) + 150px);bottom:clamp(10px,2.4vw,24px);width:clamp(96px,17vw,132px);height:auto;color:var(--accent);
    opacity:0;transform:rotate(-14deg) scale(1.12);pointer-events:none;mix-blend-mode:multiply}
  .is-sealed .stamp{opacity:.88;transform:rotate(-11deg) scale(1);transition:opacity .35s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
  .is-sealed .seal button{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule)}
  .ip-bar{transition:opacity .5s ease}.is-sealed .ip-bar{opacity:0}
  @media (prefers-reduced-motion: reduce){.is-sealed .stamp{transition:none}}
  .leaf{width:min(100%,640px);--ip-blotter-image:url(assets/blotter.webp);--ip-blotter-size:330px 385px;--ip-ink:#6a2a1b;--ip-ink-wet:#8f1e10;--ip-sheen:#fff6ea}
  .leaf .ip-surface{box-shadow:0 1px 1px rgba(20,19,18,.05),0 8px 18px -8px rgba(20,19,18,.14),0 34px 70px -30px rgba(20,19,18,.22)}
  .leaf .ip-bar{padding:0 2px}
  .leaf img{filter:grayscale(1) contrast(1.04);transition:filter 2.4s cubic-bezier(.2,.7,.2,1)}
  .leaf.has-ink img{filter:none}
</style></head><body>

<main>
  <section class="scene">
    <form class="card" id="deed" novalidate>
      <div class="no"><span>No. 0417</span><span>Commission</span></div>
      <h1>Letter of Commission</h1>
      <ol class="terms">
        <li><b>i.</b><span>The atelier shall engrave and print one edition of forty plates on laid paper.</span></li>
        <li><b>ii.</b><span>The undersigned shall pay on delivery, and keep the proofs.</span></li>
      </ol>
      <div class="sig" data-ink-pad data-name="signature" data-png-name="signature-png" data-required>
        <input class="ip-fallback" name="signature" placeholder="Type your full name" autocomplete="name" required>
        <div class="ip-surface"><div class="under" aria-hidden="true"><span>Signature</span><span>16 · X · 2026</span></div></div>
      </div>
      <svg class="stamp" viewBox="0 0 120 120" aria-hidden="true">
        <defs><path id="ring" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs>
        <circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="60" cy="60" r="34" fill="none" stroke="currentColor" stroke-width=".9"/>
        <text font-family="Inter,system-ui,sans-serif" font-size="8.6" font-weight="500" letter-spacing="3.1" fill="currentColor"><textPath href="#ring">SIGNED · SEALED · RECEIVED · MMXXVI ·</textPath></text>
        <text x="60" y="71" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="32" font-style="italic" fill="currentColor">At.</text>
      </svg>
      <div class="seal"><button type="submit">Sign &amp; seal</button></div>
    </form>
  </section>
  <section class="scene">
    <div class="leaf" data-ink-pad data-variant="margin" data-mode="annotate" data-name="notes" data-label="Notes on the page">
      <div class="ip-surface"><img id="page" src="assets/page-snails.webp" alt="" aria-hidden="true" width="1400" height="1925"></div>
    </div>
  </section>
</main>

<script>
  // A different page on each visit.
  (function () {
    var pages = [['assets/page-snails.webp', 1925], ['assets/page-merian.webp', 2068]];
    var p = pages[Math.floor(Math.random() * pages.length)], img = document.getElementById('page');
    img.src = p[0]; img.height = p[1];
  })();
</script>
<script type="module">
  import './ink-pad.js';
  const form = document.getElementById('deed');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    form.classList.add('is-sealed');
    form.querySelector('.seal button').textContent = 'Sealed';
    form.querySelector('[data-ink-pad]').inert = true;
  });
</script>
</body></html>
