<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>marbling</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="marbling.css">
<style>
  :root{--paper:#f3f0e8;--paper-2:#e9e5da;--ink:#141312;--ink-2:#4a4744;--ink-3:#8a857d;--rule:#cfcac0;--accent:#c96f4a;
    --serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif;--gutter:clamp(16px,3vw,32px)}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:19px;overflow-x:hidden}
  .tag{margin:0;font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

  /* hero: a bath composing itself, edge to edge */
  .hero{--mb-rim:0px}
  .hero .mb-stage{box-shadow:none;background:none}
  .hero .mb-bath{aspect-ratio:auto;height:min(78svh,760px)}
  @media (max-width:560px){.hero .mb-bath{height:64svh}}
  .hero .mb-hint{display:none}

  .label{display:flex;justify-content:space-between;padding:18px var(--gutter) 0}

  /* the working bath */
  .work{padding:clamp(72px,14svh,150px) var(--gutter) clamp(48px,8svh,96px);display:grid;justify-items:center}
  .work [data-marbling]{width:min(820px,100%)}

  /* the drying rack */
  .rack{padding:0 var(--gutter) clamp(90px,16svh,160px);display:grid;justify-items:center}
  .rack ol{list-style:none;margin:0;padding:0;width:min(1120px,100%);display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(22px,3vw,40px)}
  .rack li{position:relative;height:clamp(150px,20vw,250px);aspect-ratio:var(--a,3/4);background:#f6f1e4;
    box-shadow:0 1px 2px rgba(40,30,20,.14),0 18px 32px -22px rgba(40,30,20,.45);transform:rotate(var(--r,0deg))}
  @media (max-width:560px){.rack ol{gap:18px}.rack li{height:min(46vw,210px)}}
  .rack li img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .rack li.is-new{animation:settle 1.1s cubic-bezier(.2,.75,.25,1) both}
  @keyframes settle{from{opacity:0;transform:translateY(-18px) rotate(calc(var(--r,0deg) - 2deg))}}
  @media (prefers-reduced-motion:reduce){.rack li.is-new{animation:none}}
  .rack .tag{width:min(1120px,100%);margin-bottom:22px}
</style></head><body>
<main>
  <section class="hero" aria-label="A marbled pattern composing itself">
    <figure data-marbling data-autoplay data-preset="peacock">
      <img src="assets/nicholson-1856-stone.webp" alt="" aria-hidden="true">
    </figure>
  </section>
  <div class="label"><p class="tag">marbling</p></div>

  <section class="work">
    <figure data-marbling id="bath" data-preset="stone">
      <img src="assets/nicholson-1856-blue.webp" alt="" aria-hidden="true">
    </figure>
  </section>

  <section class="rack" aria-label="Prints">
    <ol id="rack">
      <li style="--r:-.6deg;--a:1310/2230"><img src="assets/nicholson-1856-stone.webp" alt="" aria-hidden="true"></li>
      <li style="--r:.5deg;--a:1313/2238"><img src="assets/nicholson-1856-blue.webp" alt="" aria-hidden="true"></li>
    </ol>
  </section>
</main>
<script type="module">
  import './marbling.js';
  const rack = document.getElementById('rack');
  document.getElementById('bath').addEventListener('marbling:print', async (e) => {
    const blob = await e.detail.png();
    if (!blob) return;
    const li = document.createElement('li');
    li.className = 'is-new';
    li.style.setProperty('--r', ((Math.random() - .5) * 1.4).toFixed(2) + 'deg');
    li.style.setProperty('--a', e.detail.canvas.width + '/' + e.detail.canvas.height);
    const img = new Image(); img.alt = ''; img.setAttribute('aria-hidden', 'true');
    img.src = URL.createObjectURL(blob);
    li.appendChild(img);
    rack.prepend(li);
    while (rack.children.length > 8) rack.lastElementChild.remove();
  });
</script>
</body></html>
