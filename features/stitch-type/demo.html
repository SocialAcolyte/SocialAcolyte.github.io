<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>stitch-type</title><link rel="icon" href="data:,">
<script>document.documentElement.classList.add('st-js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stitch-type.css"><style>
  :root{--paper:#f3f0e8;--paper-2:#e9e5da;--ink:#141312;--ink-3:#8a857d;--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif;--gutter:clamp(16px,3vw,32px)}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);overflow-x:hidden}
  .label{height:46svh;display:grid;place-items:end center;padding-bottom:7svh;font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .label.end{place-items:center;height:40svh;padding:0}

  /* 1 — natural linen, one crimson silk */
  .cloth{min-height:100svh}
  @media (max-width:600px){ .cloth .st-text{font-size:31vw;max-width:3.4em;line-height:.92} }

  /* a band of the Bayeux embroidery, drifting past, colour arriving mid-screen */
  .band{position:relative;height:min(54vw,82svh);overflow:hidden;margin:0;background:var(--paper-2)}
  .band img{position:absolute;top:50%;left:0;width:118vw;height:auto;max-width:none;display:block;margin-top:-29.5vw;
    transform:translate3d(var(--bx,0px),0,0);filter:grayscale(var(--bg,1)) contrast(1.04);will-change:transform}

  /* 2 — a hoop: indigo-dyed linen, variegated gold silk */
  .hoop-room{min-height:100svh;display:grid;place-items:center;padding:12svh var(--gutter)}
  .hoop{position:relative;width:min(86vw,74svh,700px);aspect-ratio:1;border-radius:50%}
  .hoop::before,.hoop::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
  /* the outer ring, bent beech: grain runs round the circle */
  .hoop::before{inset:calc(-1*var(--ring));z-index:2;
    --ring:clamp(12px,2.6vw,22px);
    background:
      radial-gradient(circle closest-side,transparent calc(100% - var(--ring)),rgba(60,30,8,.28) calc(100% - var(--ring) + 1px),rgba(255,236,200,.22) calc(100% - var(--ring)*.62),rgba(255,236,200,.05) calc(100% - var(--ring)*.35),rgba(60,30,8,.32) 100%),
      repeating-radial-gradient(circle at 50% 50%, rgba(90,52,22,.0) 0 2px, rgba(90,52,22,.10) 2px 3px, rgba(255,240,210,.06) 3px 5px),
      conic-gradient(from 20deg,#c99a63,#ddb27a,#c18f58,#d8ab73,#b8844e,#d6a86f,#c99a63);
    -webkit-mask:radial-gradient(circle closest-side,transparent calc(100% - var(--ring)),#000 calc(100% - var(--ring) + 1px));
            mask:radial-gradient(circle closest-side,transparent calc(100% - var(--ring)),#000 calc(100% - var(--ring) + 1px));
    box-shadow:0 18px 40px -16px rgba(40,24,10,.45),0 2px 6px rgba(40,24,10,.25)}
  /* the seam between the two rings, and the cloth pulled taut under them */
  .hoop::after{inset:0;z-index:3;box-shadow:0 0 0 1.5px rgba(70,40,15,.55),inset 0 0 0 1px rgba(255,235,200,.25),inset 0 6px 14px rgba(0,0,0,.35)}
  .hoop .st{position:absolute;inset:0;border-radius:50%;padding:0;min-height:0;
    --st-cloth:#2a3550;--st-blend:multiply;--st-ink:#c9a24a}
  .hoop .st-text{font-style:italic;font-weight:600;font-size:min(29vw,25svh,180px);max-width:2.7em;line-height:.8}
  .screw{position:absolute;z-index:4;left:50%;top:0;width:clamp(26px,5vw,40px);height:clamp(30px,6vw,46px);transform:translate(-50%,-78%);
    border-radius:5px;background:linear-gradient(90deg,#7a5a2a,#e8cf8e 35%,#b38a45 60%,#6d4f24);box-shadow:0 4px 10px rgba(40,24,10,.35)}
  .screw::after{content:"";position:absolute;left:50%;top:-38%;width:58%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#f4e2a8,#b38a45 55%,#6d4f24);box-shadow:0 2px 4px rgba(40,24,10,.35)}
  @media (max-width:600px){ .band{height:62svh} .band img{top:0;margin:0;height:100%;width:auto} }
  @media (prefers-reduced-motion: reduce){ .band img{transform:none;filter:none} }
</style></head><body>
<div class="label">scroll</div>

<section class="st cloth" data-stitch-type data-thread="#8f1d22">
  <h1 class="st-text">Hand made</h1>
</section>

<figure class="band" aria-hidden="true"><img src="assets/bayeux.webp" alt=""></figure>

<div class="hoop-room">
  <div class="hoop">
    <section class="st" data-stitch-type data-thread="#b5832e, #ecd08a, #c7922f, #8f6420" data-transfer="#ece6d6">
      <h2 class="st-text">with care</h2>
    </section>
    <span class="screw" aria-hidden="true"></span>
  </div>
</div>
<div class="label end">end</div>

<script type="module" src="stitch-type.js"></script>
<script>
  // demo ornament only: the Bayeux band drifts sideways and earns its colour mid-screen
  (() => {
    const band = document.querySelector('.band'), img = band.querySelector('img');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let raf = 0;
    const go = () => {
      raf = 0;
      const r = band.getBoundingClientRect(), vh = innerHeight;
      const t = Math.min(1, Math.max(0, (vh - r.top) / (vh + r.height)));
      const extra = Math.max(0, img.getBoundingClientRect().width - r.width);
      img.style.setProperty('--bx', (-extra * t).toFixed(1) + 'px');
      const mid = 1 - Math.min(1, Math.abs((r.top + r.height / 2) - vh / 2) / (vh * 0.45));
      img.style.setProperty('--bg', (1 - Math.min(1, mid * 1.6)).toFixed(3));
    };
    addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(go); }, { passive: true });
    addEventListener('resize', go); img.complete ? go() : img.addEventListener('load', go);
  })();
</script>
</body></html>
