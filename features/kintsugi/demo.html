<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>kintsugi</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kintsugi.css">
<style>
  :root{--paper:#f3f0e8;--paper-2:#e9e5da;--ink:#141312;--ink-2:#4a4744;--ink-3:#8a857d;--rule:#cfcac0;--accent:#c96f4a;
    --serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif;--gutter:clamp(16px,3vw,32px)}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);overflow-x:hidden}
  .tag{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
  main{max-width:1240px;margin:0 auto;padding:clamp(28px,6svh,72px) var(--gutter) 96px;display:grid;gap:clamp(40px,9svh,110px)}
  .hero{display:grid;gap:clamp(4px,1.5svh,14px);justify-items:center}
  .hero h1{margin:0;font-weight:300;font-style:italic;font-size:clamp(30px,4.6vw,52px);letter-spacing:-.005em;line-height:1;color:var(--ink-2)}
  .hero .kt, .hero [data-kintsugi]{max-width:1100px}
  .pair{display:grid;grid-template-columns:1fr;gap:clamp(8px,3vw,40px);border-top:1px solid var(--rule);padding-top:clamp(24px,5svh,56px)}
  @media (min-width:760px){.pair{grid-template-columns:1fr 1fr}}
  .pair [data-kintsugi]{--kt-aspect:1/1;--kt-aspect-narrow:1/1;--kt-size:.84}
  .foot{justify-self:center}
</style></head><body>
<main>
  <section class="hero">
    <span class="tag">404</span>
    <h1>Broken, and mended</h1>
    <figure data-kintsugi data-label="Break the dish" data-mend-label="Mend it with gold">
      <img src="assets/hydrangea-dish.webp" alt="" width="1600" height="1592">
    </figure>
  </section>
  <section class="pair" aria-label="Mended pieces">
    <figure data-kintsugi data-state="mended" data-pieces="9"><img src="assets/celadon-dish.webp" alt="" width="1600" height="1590"></figure>
    <figure data-kintsugi data-state="mended" data-pieces="8"><img src="assets/twin-fish-bowl.webp" alt="" width="1590" height="1600"></figure>
  </section>
  <span class="tag foot">kintsugi</span>
</main>
<script type="module" src="kintsugi.js"></script>
</body></html>
