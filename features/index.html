<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>StyleFeatures Selects</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400..600;1,400..600&family=Inter:wght@400;500&display=swap">
<style>
  /* Layout: a catalogue rail beside a live bench where each piece runs at fill, tablet or phone size. */
  :root{--paper:#f3f0e8;--paper-2:#e9e5da;--paper-3:#dfdace;--ink:#141312;--ink-2:#4a4744;--ink-3:#7f7a72;--rule:#cfcac0;--accent:#b8613d;--field:#fbf9f4;--bezel:var(--bezel);--code:#1f1d1b;--code-fg:#efe9dd;
        --serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif;--rail:300px;--top:64px}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1a1816;--paper-2:#23201d;--paper-3:#2e2a26;--ink:#efe9de;--ink-2:#c9c1b5;--ink-3:#958c80;--rule:#3a3530;--accent:#d98a62;--field:#14120f;--bezel:#000;--code:#100f0d;--code-fg:#efe9dd;color-scheme:dark}}
  :root[data-theme="dark"]{--paper:#1a1816;--paper-2:#23201d;--paper-3:#2e2a26;--ink:#efe9de;--ink-2:#c9c1b5;--ink-3:#958c80;--rule:#3a3530;--accent:#d98a62;--field:#14120f;--bezel:#000;--code:#100f0d;--code-fg:#efe9dd;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  html{padding:0}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased;
       display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:100%;overflow:hidden}
  a{color:inherit}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- rail ---- */
  .rail{border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
  .brand{display:flex;align-items:baseline;justify-content:space-between;padding:18px 18px 12px}
  .brand a{font-family:var(--serif);font-size:26px;text-decoration:none;line-height:1}
  .brand a em{font-style:italic}
  .brand span{color:var(--ink-3);font-size:11px}
  .search{margin:0 14px 10px;position:relative}
  .search input{width:100%;font:inherit;font-size:16px;padding:8px 10px 8px 30px;border:1px solid var(--rule);border-radius:6px;background:var(--field);color:var(--ink)}
  .search input::placeholder{color:var(--ink-3)}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--ink-3)}
  .makers{display:flex;gap:5px;flex-wrap:wrap;padding:0 14px 12px;border-bottom:1px solid var(--rule)}
  .makers button{font-size:11px;border:1px solid var(--rule);background:none;border-radius:99px;padding:4px 9px;cursor:pointer;color:var(--ink-2)}
  .makers button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .list{overflow-y:auto;flex:1;padding:4px 0 24px;scrollbar-width:thin}
  .group{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:18px 18px 6px;display:flex;justify-content:space-between}
  .item{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;
        padding:6px 14px 6px 14px;cursor:pointer;border-left:2px solid transparent}
  .item:hover{background:var(--paper-2)}
  .item[aria-current=true]{background:var(--paper-2);border-left-color:var(--accent)}
  .item img,.item .ph{width:52px;height:33px;object-fit:cover;border-radius:3px;background:var(--paper-3);filter:grayscale(1);transition:filter .5s}
  .item:hover img,.item[aria-current=true] img{filter:none}
  .item b{display:block;font-weight:500;font-size:13px;color:var(--ink)}
  .item small{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:11px;margin-top:1px}
  .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .dot.claude{background:var(--accent)} .dot.muse{background:#5d6b52} .dot.socialacolyte{background:#1f4a7a}
  .item[hidden],.group[hidden]{display:none}
  .empty{padding:24px 18px;color:var(--ink-3)}

  /* ---- main ---- */
  main{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
  .top{display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:center;padding:14px 22px 12px;border-bottom:1px solid var(--rule);min-height:var(--top)}
  .title{min-width:0}
  .title h1{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1;margin:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .title h1 small{font-family:var(--sans);font-size:11px;font-weight:400;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
  .title p{margin:6px 0 0;color:var(--ink-2);font-family:var(--serif);font-size:17px;line-height:1.3;max-width:80ch;
           overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
  .seg button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
  .seg button+button{border-left:1px solid var(--rule)}
  .seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
  .tbtn{border:1px solid var(--rule);background:none;border-radius:7px;padding:6px 10px;cursor:pointer;color:var(--ink-2);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .tbtn:hover,.seg button:hover:not([aria-pressed=true]){background:var(--paper-2);color:var(--ink)}
  .tbtn[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .tools svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6}
  kbd{font-family:var(--sans);font-size:10px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--ink-3)}

  .stage{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);background:
          radial-gradient(circle at 1px 1px,var(--paper-3) 1px,transparent 1.4px) 0 0/18px 18px,var(--paper-2)}
  .viewport{position:relative;min-width:0;min-height:0;overflow:hidden}
  .frame{position:relative;background:var(--paper);box-shadow:0 1px 0 var(--rule),0 18px 50px -20px rgba(20,19,18,.35);transform-origin:center center;
         transition:width .45s cubic-bezier(.2,.7,.2,1),height .45s cubic-bezier(.2,.7,.2,1),border-radius .45s}
  .frame iframe{display:block;width:100%;height:100%;border:0;background:var(--paper)}
  .frame.desktop{position:absolute;inset:0;box-shadow:none}
  .frame.phone,.frame.tablet{position:absolute;left:50%;top:calc(50% - 10px)}
  .frame.phone{border-radius:34px;border:10px solid var(--bezel);overflow:hidden}
  .frame.tablet{border-radius:22px;border:10px solid var(--bezel);overflow:hidden}
  .size{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink-3);pointer-events:none}
  .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-family:var(--serif);font-style:italic;font-size:18px;
           background:var(--paper);opacity:0;pointer-events:none;transition:opacity .25s}
  .frame.is-loading .loading{opacity:1}

  .readme{width:0;overflow:hidden;border-left:1px solid var(--rule);background:var(--paper);transition:width .4s cubic-bezier(.2,.7,.2,1)}
  .readme.open{width:min(460px,40vw)}
  .readme .inner{width:min(460px,40vw);height:100%;overflow-y:auto;padding:22px 26px 60px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
  .readme h1,.readme h2,.readme h3{font-family:var(--serif);font-weight:500;color:var(--ink);line-height:1.1}
  .readme h1{font-size:30px;margin:0 0 12px} .readme h2{font-size:22px;margin:26px 0 8px} .readme h3{font-size:18px;margin:20px 0 6px}
  .readme p{margin:0 0 12px}
  .readme code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--paper-2);padding:1px 4px;border-radius:3px}
  .readme pre{background:var(--code);color:var(--code-fg);padding:12px 14px;border-radius:6px;overflow-x:auto;font-size:12px;line-height:1.5}
  .readme pre code{background:none;padding:0;color:inherit}
  .readme table{border-collapse:collapse;width:100%;font-size:12px;margin:0 0 14px}
  .readme th,.readme td{border-bottom:1px solid var(--rule);padding:5px 6px;text-align:left;vertical-align:top}
  .readme ul,.readme ol{padding-left:20px;margin:0 0 12px}
  .readme blockquote{margin:0 0 12px;padding-left:12px;border-left:2px solid var(--rule)}

  .hint{font-size:11px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 10px;padding:10px 16px 12px;border-top:1px solid var(--rule)}

  /* ---- phone-sized viewer ---- */
  .pick{display:none}
  @media (max-width:820px){
    body{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:hidden}
    .rail{display:none}
    .pick{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--rule)}
    .pick a{font-family:var(--serif);font-size:22px;text-decoration:none;flex-shrink:0}
    .pick select{flex:1;min-width:0;font:inherit;font-size:16px;padding:7px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--field);color:var(--ink)}
    .pick button{border:1px solid var(--rule);background:none;border-radius:6px;padding:7px 10px;font-size:15px}
    main{grid-row:2}
    .top{grid-template-columns:1fr;padding:10px 12px}
    .top{grid-template-columns:1fr auto;align-items:center}
    .title h1{font-size:22px} .title h1 small,.title p{display:none}
    .tbtn{padding:7px 9px} .tbtn svg{width:16px;height:16px}
    .tbtn{font-size:0;gap:0}
    .seg.sizes,.hint,.kb{display:none}
    .readme.open{position:absolute;inset:0;width:100%;z-index:3}
    .readme .inner{width:100%}
  }
  @media (prefers-reduced-motion:reduce){.frame,.readme,.item img{transition:none}}

  .brand .brandname{font-family:var(--serif);font-size:26px;line-height:1}
  .brand .brandname em{font-style:italic}
  .brand .brandname small{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .brandmini{font-family:var(--serif);font-size:22px;flex-shrink:0}
</style>
</head>
<body>

<div class="pick">
  <span class="brandmini">S<em>F</em></span>
  <button type="button" data-step="-1" aria-label="Previous component">‹</button>
  <select aria-label="Component"></select>
  <button type="button" data-step="1" aria-label="Next component">›</button>
</div>
<aside class="rail">
  <div class="brand"><span class="brandname">Style<em>Features</em> <small>selects</small></span><span class="total"></span></div>
  <label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke-width="1.6"/></svg>
    <input type="search" placeholder="Search  ( / )" aria-label="Search components"></label>
  <div class="makers" role="group" aria-label="Filter by maker"></div>
  <nav class="list" aria-label="Components"></nav>
  <div class="hint kb"><span><kbd>↑</kbd><kbd>↓</kbd> step</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> size</span><span><kbd>R</kbd> reload</span><span><kbd>D</kbd> readme</span><span><kbd>O</kbd> open</span><span><kbd>/</kbd> search</span></div>
</aside>
<main>
  <header class="top">
    <div class="title"><h1><span class="name"></span><small class="by"></small></h1><p class="blurb"></p></div>
    <div class="tools">
      <div class="seg sizes" role="group" aria-label="Viewport">
        <button type="button" data-size="desktop" aria-pressed="true" title="Fill (1)">Fill</button>
        <button type="button" data-size="tablet" aria-pressed="false" title="Tablet 820×1180 (2)">Tablet</button>
        <button type="button" data-size="phone" aria-pressed="false" title="Phone 390×844 (3)">Phone</button>
      </div>
      <button type="button" class="tbtn reload" title="Reload (R)"><svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>Reload</button>
      <button type="button" class="tbtn readme-btn" aria-pressed="false" title="README (D)"><svg viewBox="0 0 16 16"><path d="M3 2.5h7l3 3v8H3z M10 2.5v3h3 M5.5 8h5 M5.5 10.5h5"/></svg>Readme</button>
      <a class="tbtn open" target="_blank" rel="noopener" title="Open in a new tab (O)"><svg viewBox="0 0 16 16"><path d="M9 3h4v4 M13 3L7.5 8.5 M11 9.5V13H3V5h3.5"/></svg>Open</a>
    </div>
  </header>
  <div class="stage">
    <div class="viewport">
      <div class="frame desktop"><iframe title="Component demo" allow="accelerometer; gyroscope; clipboard-write; vibrate"></iframe><div class="loading">loading…</div></div>
      <div class="size"></div>
    </div>
    <aside class="readme" aria-label="README"><div class="inner"></div></aside>
  </div>
</main>
<script>
const DATA = {"categories": [["images", "Images & materials"], ["type", "Type & text"], ["objects", "Objects you handle"], ["controls", "Controls & forms"], ["scroll", "Scroll & navigation"]], "makers": {"claude": "Claude Code", "socialacolyte": "SocialAcolyte"}, "items": [{"name": "ripple-pool", "cat": "images", "by": "claude", "after": "Evan Wallace", "blurb": "A Roman marine mosaic seen through a shallow pool of clear water, after Evan Wallace's WebGL Water.", "demo": "ripple-pool/demo.html", "readme": "ripple-pool/README.md", "thumb": "thumbs/ripple-pool.webp"}, {"name": "loupe", "cat": "images", "by": "claude", "after": "Evan Wallace", "blurb": "A round reading glass lying on a print.", "demo": "loupe/demo.html", "readme": "loupe/README.md", "thumb": "thumbs/loupe.webp"}, {"name": "marbling", "cat": "images", "by": "claude", "after": "paper.js", "blurb": "A marbler's bath. Tap to drop ink and it opens on the size, pushing every earlier colour aside. Drag to pull a stylus through it, or draw a comb of tines across to get the feathered rows of a nonpareil.", "demo": "marbling/demo.html", "readme": "marbling/README.md", "thumb": "thumbs/marbling.webp"}, {"name": "hanging-tapestry", "cat": "images", "by": "claude", "after": "Evan Wallace", "blurb": "A woven hanging on a turned wooden rod with brass finials, hung by a cord from one nail. The cloth is a real simulation, not a picture of one.", "demo": "hanging-tapestry/demo.html", "readme": "hanging-tapestry/README.md", "thumb": "thumbs/hanging-tapestry.webp"}, {"name": "light-rays", "cat": "images", "by": "claude", "after": "Evan Wallace", "blurb": "Sunlight falling on the page, meant to pass for the real thing: a warm, washed-out patch in the shape of the window it came through, crisp at the sill and soft at its far end, with ink lifted to grey inside it and the room's shade outside.", "demo": "light-rays/demo.html", "readme": "light-rays/README.md", "thumb": "thumbs/light-rays.webp"}, {"name": "stitch-type", "cat": "type", "by": "claude", "after": "tonsky", "blurb": "A heading sewn in silk on linen.", "demo": "stitch-type/demo.html", "readme": "stitch-type/README.md", "thumb": "thumbs/stitch-type.webp"}, {"name": "pretext-calligram", "cat": "type", "by": "claude", "after": "Cheng Lou", "blurb": "A paragraph poured into a vessel. The text is set inside the silhouette of a real object, a cut-out amphora or vase, line by line, justified so the edges of the words are the edge of the pot.", "demo": "pretext-calligram/demo.html", "readme": "pretext-calligram/README.md", "thumb": "thumbs/pretext-calligram.webp"}, {"name": "pretext-halftone", "cat": "type", "by": "claude", "after": "Cheng Lou", "blurb": "A portrait made of nothing but a paragraph.", "demo": "pretext-halftone/demo.html", "readme": "pretext-halftone/README.md", "thumb": "thumbs/pretext-halftone.webp"}, {"name": "pretext-tesserae", "cat": "type", "by": "claude", "after": "Cheng Lou", "blurb": "A paragraph laid as a mosaic. The picture is cut into stones the way a Roman mosaicist set them: a row or two of stones hugging every outline and following its curve, and the ground filled in straight courses.", "demo": "pretext-tesserae/demo.html", "readme": "pretext-tesserae/README.md", "thumb": "thumbs/pretext-tesserae.webp"}, {"name": "pretext-spiral", "cat": "type", "by": "claude", "after": "Cheng Lou", "blurb": "A paragraph wound onto a disc of fired clay, like the Phaistos Disc.", "demo": "pretext-spiral/demo.html", "readme": "pretext-spiral/README.md", "thumb": "thumbs/pretext-spiral.webp"}, {"name": "pretext-gloss", "cat": "type", "by": "claude", "after": "Cheng Lou", "blurb": "The glossed page: a medieval glossed Bible, a Talmud folio or a Renaissance commentary page, laid out live. The main text sits in the middle in larger type, under a painted initial.", "demo": "pretext-gloss/demo.html", "readme": "pretext-gloss/README.md", "thumb": "thumbs/pretext-gloss.webp"}, {"name": "pretext-inscription", "cat": "type", "by": "claude", "after": "Cheng Lou", "blurb": "A Roman inscription cut into a broken stone.", "demo": "pretext-inscription/demo.html", "readme": "pretext-inscription/README.md", "thumb": "thumbs/pretext-inscription.webp"}, {"name": "kintsugi", "cat": "objects", "by": "claude", "after": "Poimandres", "blurb": "A porcelain dish lying on the paper. Tap it and it cracks from where you tapped, comes apart, and the pieces jump, tumble a little and slide to rest around it, with a few chips.", "demo": "kintsugi/demo.html", "readme": "kintsugi/README.md", "thumb": "thumbs/kintsugi.webp"}, {"name": "moodboard", "cat": "objects", "by": "claude", "after": "tldraw", "blurb": "A pinboard for collecting pictures: paper prints on an endless sheet of board you can pan and zoom like tldraw or Figma. On arrival the prints lie in a pile and are dealt out into a loose cluster.", "demo": "moodboard/demo.html", "readme": "moodboard/README.md", "thumb": "thumbs/moodboard.webp"}]};
const SIZES = { desktop: null, tablet: [820, 1180], phone: [390, 844] };
const $ = (s) => document.querySelector(s);
const list = $('.list'), frame = $('.frame'), iframe = $('iframe'), sizeLabel = $('.size');
const readme = $('.readme'), readmeInner = $('.readme .inner'), readmeBtn = $('.readme-btn');
const select = $('.pick select'), search = $('.search input');
let current = null, size = 'desktop', makerFilter = null;

// ---- rail ----
$('.total').textContent = DATA.items.length + ' pieces';
const byName = Object.fromEntries(DATA.items.map((it) => [it.name, it]));
const buttons = {};
for (const [key, title] of DATA.categories) {
  const items = DATA.items.filter((it) => it.cat === key);
  if (!items.length) continue;
  const g = document.createElement('div'); g.className = 'group'; g.dataset.cat = key;
  g.innerHTML = `<span>${title}</span><span>${items.length}</span>`;
  list.append(g);
  const og = document.createElement('optgroup'); og.label = title; select.append(og);
  for (const it of items) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'item'; b.dataset.name = it.name; b.dataset.cat = key; b.dataset.by = it.by;
    b.innerHTML = (it.thumb ? `<img src="${it.thumb}" alt="" loading="lazy">` : '<span class="ph"></span>') +
      `<span><b>${it.name}</b><small><span class="dot ${it.by}"></span>${DATA.makers[it.by] || ''}${it.after ? ' · after ' + it.after : ''}</small></span>`;
    b.addEventListener('click', () => go(it.name));
    list.append(b); buttons[it.name] = b;
    const o = document.createElement('option'); o.value = it.name; o.textContent = it.name; og.append(o);
  }
}
const order = [...list.querySelectorAll('.item')].map((b) => b.dataset.name);

const makers = $('.makers');
for (const [k, label] of Object.entries(DATA.makers)) {
  const n = DATA.items.filter((it) => it.by === k).length;
  if (!n) continue;
  const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<span class="dot ${k}" style="display:inline-block;margin-right:5px"></span>${label} ${n}`;
  b.addEventListener('click', () => {
    makerFilter = makerFilter === k ? null : k;
    makers.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b && makerFilter === k)));
    filter();
  });
  makers.append(b);
}

function filter() {
  const q = search.value.trim().toLowerCase();
  let any = false;
  for (const name of order) {
    const it = byName[name];
    const hit = (!makerFilter || it.by === makerFilter) &&
      (!q || (it.name + ' ' + it.blurb + ' ' + (it.after || '') + ' ' + (DATA.makers[it.by] || '')).toLowerCase().includes(q));
    buttons[name].hidden = !hit; any ||= hit;
  }
  list.querySelectorAll('.group').forEach((g) => {
    g.hidden = !list.querySelector(`.item[data-cat="${g.dataset.cat}"]:not([hidden])`);
  });
  let e = list.querySelector('.empty');
  if (!any && !e) { e = document.createElement('p'); e.className = 'empty'; e.textContent = 'Nothing matches.'; list.append(e); }
  if (any && e) e.remove();
}
search.addEventListener('input', filter);

// ---- showing one ----
function go(name, push = true) {
  const it = byName[name] || byName[order[0]];
  if (!it) return;
  current = it.name;
  for (const [n, b] of Object.entries(buttons)) b.setAttribute('aria-current', String(n === current));
  buttons[current].scrollIntoView({ block: 'nearest' });
  select.value = current;
  $('.name').textContent = it.name;
  $('.by').innerHTML = `<span class="dot ${it.by}"></span>${DATA.makers[it.by] || ''}${it.after ? ' · after ' + it.after : ''}`;
  $('.blurb').textContent = it.blurb;
  $('.open').href = it.demo;
  document.title = it.name + ' · StyleFeatures';
  load();
  if (readme.classList.contains('open')) loadReadme();
  if (push) history.replaceState(null, '', '#' + current);
}
function load() {
  frame.classList.add('is-loading');
  iframe.src = byName[current].demo + '?v=' + Date.now();
}
iframe.addEventListener('load', () => frame.classList.remove('is-loading'));

// ---- viewport sizes: the frame is the real device size, scaled to fit ----
function fit() {
  const dims = SIZES[size];
  frame.className = 'frame ' + size + (frame.classList.contains('is-loading') ? ' is-loading' : '');
  if (!dims) { frame.style.cssText = ''; sizeLabel.textContent = ''; return; }
  const vp = $('.viewport').getBoundingClientRect();
  const bw = 20, [w, h] = dims;
  const s = Math.min(1, (vp.width - 48) / (w + bw), (vp.height - 64) / (h + bw));
  frame.style.width = (w + bw) + 'px';
  frame.style.height = (h + bw) + 'px';
  frame.style.transform = `translate(-50%, -50%) scale(${s})`;
  sizeLabel.textContent = `${w} × ${h}` + (s < 1 ? ` · shown at ${Math.round(s * 100)}%` : '');
}
function setSize(s) {
  size = s;
  document.querySelectorAll('[data-size]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.size === s)));
  fit();
}
document.querySelectorAll('[data-size]').forEach((b) => b.addEventListener('click', () => setSize(b.dataset.size)));
new ResizeObserver(fit).observe($('.viewport'));

// ---- readme: a small Markdown renderer, enough for these READMEs ----
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => `<a href="${/^(https?:|#|\/)/.test(u) ? u : byName[current].demo.replace(/demo\.html$/, '') + u}" target="_blank" rel="noopener">${t}</a>`);
}
function md(src) {
  const lines = src.replace(/\r/g, '').split('\n'); let out = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { let code = ''; i++; while (i < lines.length && !/^```/.test(lines[i])) code += lines[i++] + '\n'; i++; out += `<pre><code>${esc(code)}</code></pre>`; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/); if (h) { out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
    if (/^\s*\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      out += '<table>' + rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r)).map((r, k) =>
        '<tr>' + cells(r).map((c) => k ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join('') + '</tr>').join('') + '</table>';
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); let items = '';
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        let t = lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, '');
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) t += ' ' + lines[i++].trim();
        items += `<li>${inline(t)}</li>`;
      }
      out += ordered ? `<ol>${items}</ol>` : `<ul>${items}</ul>`; continue;
    }
    if (/^>\s?/.test(l)) { let t = ''; while (i < lines.length && /^>\s?/.test(lines[i])) t += lines[i++].replace(/^>\s?/, '') + ' '; out += `<blockquote>${inline(t)}</blockquote>`; continue; }
    if (!l.trim()) { i++; continue; }
    let p = ''; while (i < lines.length && lines[i].trim() && !/^(#|```|\s*\||\s*([-*]|\d+\.)\s|>)/.test(lines[i])) p += lines[i++] + ' ';
    out += `<p>${inline(p.trim())}</p>`;
  }
  return out;
}
async function loadReadme() {
  const want = current;
  readmeInner.innerHTML = '<p>…</p>';
  try {
    const r = await fetch(byName[want].readme);
    const t = r.ok ? await r.text() : 'No README.';
    if (want === current) { readmeInner.innerHTML = md(t); readmeInner.scrollTop = 0; }
  } catch (e) { readmeInner.textContent = 'Could not load the README.'; }
}
function toggleReadme(on = !readme.classList.contains('open')) {
  readme.classList.toggle('open', on);
  readmeBtn.setAttribute('aria-pressed', String(on));
  if (on) loadReadme();
  setTimeout(fit, 420);
}
readmeBtn.addEventListener('click', () => toggleReadme());
$('.reload').addEventListener('click', load);

// ---- stepping ----
function visibleOrder() { return order.filter((n) => !buttons[n].hidden); }
function step(d) {
  const v = visibleOrder(); if (!v.length) return;
  const i = v.indexOf(current);
  go(v[(i + d + v.length) % v.length]);
}
document.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => step(+b.dataset.step)));
select.addEventListener('change', () => go(select.value));
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target === search) {
    if (e.key === 'Escape') { search.value = ''; filter(); search.blur(); }
    if (e.key === 'Enter') { const v = visibleOrder(); if (v.length) { go(v[0]); search.blur(); } }
    return;
  }
  if (e.target.closest('select,input,textarea')) return;
  const k = e.key;
  if (k === 'ArrowDown' || k === 'j') { e.preventDefault(); step(1); }
  else if (k === 'ArrowUp' || k === 'k') { e.preventDefault(); step(-1); }
  else if (k === '1') setSize('desktop'); else if (k === '2') setSize('tablet'); else if (k === '3') setSize('phone');
  else if (k === 'r' || k === 'R') load();
  else if (k === 'd' || k === 'D') toggleReadme();
  else if (k === 'o' || k === 'O') window.open(byName[current].demo, '_blank', 'noopener');
  else if (k === '/') { e.preventDefault(); search.focus(); search.select(); }
});
const fromHash = () => decodeURIComponent(location.hash.slice(1)).split(/[?&]/)[0];
addEventListener('hashchange', () => { const n = fromHash(); if (n && n !== current) go(n, false); });

go(fromHash() || order[0], false);
fit();
</script>

</body>
</html>
