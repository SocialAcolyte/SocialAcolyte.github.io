<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>split-flap</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="split-flap.css">
<style>
  :root{--paper:#f3f0e8;--paper-2:#e9e5da;--ink:#141312;--ink-2:#4a4744;--ink-3:#8a857d;--rule:#cfcac0;--accent:#c96f4a;
    --sans:Inter,system-ui,sans-serif;--gutter:clamp(16px,3vw,32px)}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow-x:hidden}
  .tag{font:500 10.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
  main{max-width:1180px;margin:0 auto;padding:0 var(--gutter) 96px}

  /* the headline */
  .hero{min-height:min(76svh,820px);display:grid;place-items:center;align-content:center;gap:28px;padding:56px 0 40px}
  .hero .sf, .hero [data-split-flap]{--sf-size:clamp(66px,calc((100vw - 2 * var(--gutter)) / 4.45),178px)}
  .hero [data-split-flap]{font-size:var(--sf-size)}

  /* the departures board */
  .board{position:relative;width:min(1120px,100%);margin:0 auto;background:#141312;color:#cfc6b2;border-radius:8px;
    padding:clamp(14px,2.4vw,28px) clamp(12px,2.6vw,32px) clamp(16px,2.6vw,30px);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 0 0 1px #0b0a09,0 40px 70px -40px rgba(30,22,12,.55),0 3px 8px -4px rgba(30,22,12,.4)}
  .board::before{content:"";position:absolute;inset:6px;border:1px solid rgba(255,240,215,.05);border-radius:5px;pointer-events:none}
  .board header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 2px clamp(12px,2vw,20px);border-bottom:1px solid rgba(255,240,215,.08);margin-bottom:clamp(8px,1.4vw,14px)}
  .board h2{margin:0;font:500 clamp(11px,1.2vw,13px)/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:#d9cfb8}
  .board h2 span{color:#7d7568;margin-left:.9em;letter-spacing:.22em}
  .board header .sf, .board header [data-split-flap]{--sf-size:clamp(20px,2.4vw,30px);font-size:var(--sf-size)}
  table{width:100%;border-collapse:collapse;--sf-size:clamp(21px,calc((100vw - 2 * var(--gutter) - 40px) / 12.6),50px)}
  th{font:500 9.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#7d7568;text-align:left;padding:4px 0 10px}
  td{padding:clamp(3px,.5vw,6px) 0;border-top:1px solid rgba(255,240,215,.045)}
  tbody tr:first-child td{border-top:0}
  td + td, th + th{padding-left:clamp(10px,1.6vw,26px)}
  .board td [data-split-flap]{font-size:var(--sf-size);--sf-board:transparent;--sf-pad:0}
  th:not(:first-child),td:not(:first-child){width:1%;white-space:nowrap}
  @media (max-width:760px){ .col-rem{display:none} }
  .board footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:clamp(12px,2vw,20px);padding-top:clamp(12px,2vw,18px);border-top:1px solid rgba(255,240,215,.08)}
  .board footer .tag{color:#7d7568}
  .board footer [data-split-flap]{--sf-size:clamp(18px,2vw,24px);font-size:var(--sf-size)}

  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:56px}
  .snd{appearance:none;background:none;border:1px solid var(--rule);border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--ink-2)}
  .snd:hover{border-color:var(--ink-3)}
  .snd:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
  .snd[aria-pressed="true"]{color:var(--ink);border-color:var(--ink-2)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style></head><body>
<main>
  <section class="hero">
    <h1 style="margin:0;font-weight:inherit"><span data-split-flap data-theme="light" data-drum="alpha" data-align="center" data-words="WANDER, ARRIVE, LINGER, DEPART, RETURN" data-interval="2600" data-live="off">WANDER</span></h1>
  </section>

  <section class="board" aria-labelledby="dep">
    <header>
      <h2 id="dep">Partenze<span>Departures</span></h2>
      <span data-split-flap data-clock="HH:MM:SS" data-sound="false" style="--sf-board:transparent;--sf-pad:0"></span>
    </header>
    <table>
      <thead><tr><th scope="col">Destination</th><th scope="col">Time</th><th scope="col">Plat.</th><th scope="col" class="col-rem">Remarks</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <footer>
      <span class="tag">Travellers today</span>
      <span id="count" data-split-flap data-counter="4218" data-length="6" data-live="off" style="--sf-board:transparent;--sf-pad:0"></span>
    </footer>
    <p class="sr" aria-live="polite" id="said"></p>
  </section>

  <div class="foot"><span class="tag">split-flap</span><button class="snd tag" type="button" aria-pressed="false">Sound</button></div>
</main>
<script type="module">
  import { splitFlap } from './split-flap.js';

  const PLACES = ['ROMA','ALEXANDRIA','KNOSSOS','BYZANTIUM','ATHENAI','CARTHAGO','EPHESOS','DELPHOI','MASSALIA','RAVENNA',
    'PALMYRA','ANTIOCHIA','PERGAMON','OSTIA','CYRENE','RHODOS','SMYRNA','NEAPOLIS','MILETOS','CORINTHOS','BRUNDISIUM','AQUILEIA','GADES','LONDINIUM','SYRACUSAE','TARRACO'];
  const ROWS = 7;
  let clock = 9 * 60 + 5, pi = 0;
  const fmt = (m) => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  const plat = () => String(1 + Math.floor(Math.random() * 12));
  const next = () => { clock += 5 + 5 * Math.floor(Math.random() * 3); return { dest: PLACES[pi++ % PLACES.length], time: fmt(clock), plat: plat() }; };
  const remark = (i, r) => i === 0 ? 'BOARDING' : i === 1 ? 'GATE OPEN' : r.late ? 'DELAYED' : 'ON TIME';

  let board = Array.from({ length: ROWS }, next);
  board[4].late = true;
  const tbody = document.getElementById('rows');
  const flaps = board.map((r, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><span data-length="10" data-drum="alpha" data-live="off">${r.dest}</span></td>
      <td><span data-mask="99:99" data-live="off">${r.time}</span></td>
      <td><span data-length="2" data-drum="blankdigits" data-align="right" data-live="off">${r.plat}</span></td>
      <td class="col-rem"><span data-length="9" data-drum="alpha" data-live="off">${remark(i, r)}</span></td>`;
    tbody.appendChild(tr);
    return [...tr.querySelectorAll('span')].map((el) => splitFlap(el));
  });

  // every so often the first train leaves and the board rolls up a line
  const said = document.getElementById('said');
  const count = document.getElementById('count');
  let travellers = 4218, visible = false;
  function roll() {
    if (!visible || document.hidden) return;
    board.shift();
    const r = next(); if (Math.random() < 0.3) r.late = true;
    board.push(r);
    board.forEach((r, i) => {
      const d = i * 70;
      flaps[i][0].setText(r.dest, { delay: d });
      flaps[i][1].setText(r.time, { delay: d + 40 });
      flaps[i][2].setText(r.plat, { delay: d + 60 });
      flaps[i][3].setText(remark(i, r), { delay: d + 80 });
    });
    travellers += 20 + Math.floor(Math.random() * 60);
    count.splitFlap.setValue(travellers);
    said.textContent = `Now boarding: ${board[0].dest.toLowerCase()}, ${board[0].time}, platform ${board[0].plat}.`;
  }
  let timer = setInterval(roll, 7000);
  new IntersectionObserver((es) => { visible = es[0].isIntersecting; }, { threshold: 0.25 }).observe(document.querySelector('.board'));

  // sound is off until asked for
  const btn = document.querySelector('.snd');
  btn.addEventListener('click', () => {
    const on = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', on);
    document.querySelectorAll('.sf').forEach((el) => el.splitFlap && el.splitFlap.sound(on));
  });
</script>
</body></html>
